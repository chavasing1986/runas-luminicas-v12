<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lenguaje Geométrico Universal V30</title>
<style>
body{margin:0;background:#060910;color:#eee;font-family:Inter,Arial,sans-serif}
.app{display:grid;grid-template-columns:300px 1fr 300px;gap:18px;padding:18px;min-height:100vh;
background:
radial-gradient(circle at 50% 15%,rgba(0,180,255,.08),transparent 35%),
radial-gradient(circle at 50% 50%,rgba(212,175,55,.06),transparent 45%),#060910;}
.panel{background:rgba(12,18,30,.82);border:1px solid rgba(212,175,55,.35);border-radius:18px;padding:18px;backdrop-filter:blur(10px);box-shadow:0 0 40px rgba(0,0,0,.4)}
h1{font:700 28px Georgia,serif;color:#d9ab4d;letter-spacing:.15em;text-align:center}
h2{font:600 13px Arial;color:#d9ab4d;text-transform:uppercase;letter-spacing:.18em}
small{color:#9ba9bf}
.center{display:flex;flex-direction:column}
.hero{flex:1;border:1px solid rgba(212,175,55,.2);border-radius:22px;background:radial-gradient(circle,#0d1625,#040608);display:flex;align-items:center;justify-content:center}
svg{width:min(760px,90%);aspect-ratio:1}
.actions{display:flex;gap:10px;justify-content:center;padding:16px}
button{background:#7b5214;color:#fff3c4;border:1px solid #d4af37;border-radius:10px;padding:10px 16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{padding:12px;border:1px solid rgba(212,175,55,.15);border-radius:12px;background:#0b1321}
input{width:100%;padding:10px;background:#07101d;border:1px solid #444;color:#fff;border-radius:8px}
@media(max-width:1100px){.app{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="panel">
<h2>Lenguaje Geométrico</h2>
<p><small>Motor Genético V30</small></p>
<label>Nombre</label>
<input value="MARIA MAGDALENA VAZQUEZ">
<div class="grid">
<div class="card"><b>ADN</b><br><small>Secuencia nominal</small></div>
<div class="card"><b>Gramática</b><br><small>Instrucciones</small></div>
<div class="card"><b>Frecuencia</b><br><small>Resonancia</small></div>
<div class="card"><b>Semilla</b><br><small>Hash</small></div>
</div>
</div>

<div class="panel center">
<h1>FIRMA GEOMÉTRICA PERSONAL</h1>
<div class="hero">
<svg viewBox="-500 -500 1000 1000">
<defs>
<linearGradient id="g"><stop offset="0" stop-color="#7d5319"/><stop offset=".5" stop-color="#ffe7a1"/><stop offset="1" stop-color="#8b5c1f"/></linearGradient>
</defs>
<circle r="455" fill="none" stroke="url(#g)" stroke-width="8"/>
<circle r="420" fill="none" stroke="url(#g)" opacity=".3"/>
<g stroke="url(#g)" fill="none">
<circle r="350"/><circle r="280"/><circle r="210"/>
<ellipse rx="360" ry="240"/><ellipse rx="240" ry="360"/>
<path d="M0-420L0 420M-420 0L420 0"/>
<path d="M-300-300L300 300M300-300L-300 300"/>
<path d="M0-330L286 165-286 165Z"/>
<path d="M0 330L286-165-286-165Z"/>
</g>
<g fill="url(#g)">
<circle r="18"/>
<circle cx="0" cy="-330" r="10"/>
<circle cx="0" cy="330" r="10"/>
<circle cx="-330" cy="0" r="10"/>
<circle cx="330" cy="0" r="10"/>
</g>
</svg>
</div>
<div class="actions">
<button>SVG</button><button>PNG 8K</button><button>PDF</button><button>Blueprint</button>
</div>
</div>

<div class="panel">
<h2>Interpretación</h2>
<div class="card"><b>Arquitectura</b><br><small>Motor de crecimiento</small></div>
<div class="card"><b>Topología</b><br><small>Huella irrepetible</small></div>
<div class="card"><b>Joyería</b><br><small>95% de ocupación</small></div>
<div class="card"><b>Estado</b><br><small>Apto para grabado láser</small></div>
</div>
</div>
</body>
</html>
